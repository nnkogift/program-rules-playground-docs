server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml image/svg+xml;

    # trailingSlash is false in docusaurus.config.ts, so /page is served from
    # /page.html. Redirect the trailing-slash form of a URL to match.
    location ~ ^/(.+)/$ {
        return 301 /$1;
    }

    # HTML, the search index and the sitemap must always be revalidated.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Hashed build output never changes for a given filename.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:ico|png|jpe?g|gif|svg|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }
}
